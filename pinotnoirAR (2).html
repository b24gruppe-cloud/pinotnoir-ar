  const RIGHT_PATH_PUPIL_R    = "M 79.386719 57.929688 C 78.984375 57.929688 78.585938 57.828125 78.285156 57.578125 C 77.683594 57.128906 77.382812 56.328125 77.582031 55.628906 C 77.683594 55.175781 77.984375 54.828125 78.335938 54.578125 C 77.984375 54.578125 77.582031 54.625 77.234375 54.777344 L 76.984375 54.226562 C 77.734375 53.824219 78.683594 53.824219 79.4375 54.226562 C 80.1875 54.578125 80.785156 55.328125 80.988281 56.179688 C 81.039062 56.476562 81.039062 56.679688 80.988281 56.929688 C 80.886719 57.230469 80.6875 57.527344 80.335938 57.730469 C 80.085938 57.828125 79.734375 57.929688 79.386719 57.929688 Z M 79.183594 54.777344 L 79.183594 54.828125 C 78.683594 54.875 78.285156 55.277344 78.132812 55.777344 C 78.035156 56.226562 78.234375 56.828125 78.585938 57.078125 C 78.984375 57.378906 79.585938 57.378906 79.984375 57.128906 C 80.1875 57.027344 80.285156 56.878906 80.335938 56.679688 C 80.386719 56.578125 80.386719 56.429688 80.335938 56.226562 C 80.238281 55.628906 79.785156 55.078125 79.183594 54.777344 Z M 79.183594 54.777344 ";
  const RIGHT_PATH_PUPIL_L    = "M 35.785156 58.628906 C 35.636719 58.628906 35.535156 58.628906 35.386719 58.578125 C 34.484375 58.378906 33.933594 57.480469 33.835938 56.679688 C 33.785156 55.929688 34.085938 55.328125 34.734375 55.078125 C 35.4375 54.777344 36.238281 54.925781 36.835938 55.578125 C 37.4375 56.179688 37.636719 56.980469 37.386719 57.628906 C 37.136719 58.230469 36.4375 58.628906 35.785156 58.628906 Z M 35.4375 55.527344 C 35.285156 55.527344 35.136719 55.578125 34.984375 55.628906 C 34.433594 55.878906 34.433594 56.378906 34.433594 56.628906 C 34.484375 57.179688 34.886719 57.828125 35.535156 57.980469 C 36.035156 58.078125 36.6875 57.78125 36.886719 57.328125 C 37.039062 56.929688 36.886719 56.378906 36.488281 55.929688 C 36.335938 55.828125 35.9375 55.527344 35.4375 55.527344 Z M 35.4375 55.527344 ";

  const S = 2; // canvas px per original label pt (label is 432 x 288 pt)
  const CANVAS_W = 432 * S, CANVAS_H = 288 * S;
  const LEFT_OFFSET = { x: 50 * S, y: 6 * S };
  const RIGHT_OFFSET = { x: 270 * S, y: 0 * S };

  const LEFT_MASK  = { x: 84, y: 0,   w: 280, h: 470 };
  const RIGHT_MASK = { x: 524, y: -60, w: 300, h: 510 };

  const PIVOT = {
    leftMain: { x: 72.71, y: 22.78 },
    leftHand: { x: 52.49, y: 66.80 },
    rightHead:{ x: 58.46, y: 112.42 },
    rightBase:{ x: 72.48, y: 83.15 },
    pupilR:   { x: 79.01, y: 55.88 },
    pupilL:   { x: 35.71, y: 56.70 }
  };

  function toRad(deg){ return deg * Math.PI / 180; }
  function lerp(a,b,t){ return a + (b-a)*t; }
  // simple piecewise-linear keyframe evaluator: stops = [[t0,v0],[t1,v1],...] with t in [0,1]
  function kf(stops, t){
    if (t <= stops[0][0]) return stops[0][1];
    for (let i=0;i<stops.length-1;i++){
      const [t0,v0] = stops[i], [t1,v1] = stops[i+1];
      if (t >= t0 && t <= t1){
        const f = (t1===t0) ? 0 : (t-t0)/(t1-t0);
        return lerp(v0,v1,f);
      }
    }
    return stops[stops.length-1][1];
  }

  const LEAN_STOPS  = [[0,0],[0.35,-4],[0.60,-2],[1,0]];
  const NOD_STOPS   = [[0,0],[0.38,3.5],[0.62,-1],[1,0]];
  const SWAY_STOPS  = [[0,0],[0.38,1],[1,0]];
  const BLINK_STOPS = [[0,1],[0.40,1],[0.46,0.12],[0.52,0.12],[0.58,1],[0.78,0.12],[0.84,0.12],[0.90,1],[1,1]];
  const WAVE_STOPS  = [[0,0],[0.25,16],[0.5,-8],[0.75,12],[1,0]];

  const GREETING_MS = 2600;
  const WAVE_PERIOD_MS = 1700;
  const HOLD_MS = 1200; // time fully settled before fading mask away

  let ctx, canvas, texture, drawFn;
  let greetStart = null;
  let active = false;

  function buildPath(dStr){ return new Path2D(dStr); }

  const pLeftMain = buildPath(LEFT_PATH_MAIN);
  const pLeftHand = buildPath(LEFT_PATH_HAND);
  const pRFeatL = buildPath(RIGHT_PATH_FEATURES_L);
  const pRFeatR = buildPath(RIGHT_PATH_FEATURES_R);
  const pRCheek = buildPath(RIGHT_PATH_CHEEK);
  const pRNeck = buildPath(RIGHT_PATH_NECK);
  const pRCollar = buildPath(RIGHT_PATH_COLLAR);
  const pRHairTop = buildPath(RIGHT_PATH_HAIR_TOP);
  const pRHairSide = buildPath(RIGHT_PATH_HAIR_SIDE);
  const pRPupilR = buildPath(RIGHT_PATH_PUPIL_R);
  const pRPupilL = buildPath(RIGHT_PATH_PUPIL_L);

  function drawRotated(c, offset, pivot, angleDeg, paths, extraScaleY){
    c.save();
    c.translate(offset.x, offset.y);
    c.translate(pivot.x*S, pivot.y*S);
    c.rotate(toRad(angleDeg));
    if (extraScaleY !== undefined) c.scale(1, extraScaleY);
    c.translate(-pivot.x*S, -pivot.y*S);
    c.scale(S,S);
    c.fillStyle = '#1c1a17';
    paths.forEach(p => c.fill(p));
    c.restore();
  }

  function drawFrame(){
    ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
    if (!active) return;

    const elapsed = performance.now() - greetStart;
    const doneMain = elapsed >= GREETING_MS;
    const holdOver = elapsed >= (GREETING_MS + HOLD_MS);

    if (holdOver){ active = false; return; }

    // paper-colour patches so the animated lines replace the printed ones underneath
    ctx.fillStyle = '#f7f4ee';
    ctx.fillRect(LEFT_MASK.x, LEFT_MASK.y, LEFT_MASK.w, LEFT_MASK.h);
    ctx.fillRect(RIGHT_MASK.x, RIGHT_MASK.y, RIGHT_MASK.w, RIGHT_MASK.h);

    const tMain = Math.min(1, elapsed / GREETING_MS);
    const tWave = (elapsed % WAVE_PERIOD_MS) / WAVE_PERIOD_MS;
    const waveActive = elapsed < WAVE_PERIOD_MS * 2;

    const leanAngle = kf(LEAN_STOPS, tMain);
    const waveAngle = waveActive ? kf(WAVE_STOPS, tWave) : 0;
    const nodAngle  = kf(NOD_STOPS, tMain);
    const swayAngle = kf(SWAY_STOPS, tMain);
    const blinkY    = kf(BLINK_STOPS, tMain);

    drawRotated(ctx, LEFT_OFFSET, PIVOT.leftMain, leanAngle, [pLeftMain]);
    drawRotated(ctx, LEFT_OFFSET, PIVOT.leftHand, waveAngle, [pLeftHand]);

    drawRotated(ctx, RIGHT_OFFSET, PIVOT.rightBase, swayAngle, [pRNeck, pRCollar]);
    drawRotated(ctx, RIGHT_OFFSET, PIVOT.rightHead, nodAngle, [pRFeatL, pRFeatR, pRCheek, pRHairTop, pRHairSide]);
    drawRotated(ctx, RIGHT_OFFSET, PIVOT.pupilR, 0, [pRPupilR], blinkY);
    drawRotated(ctx, RIGHT_OFFSET, PIVOT.pupilL, 0, [pRPupilL], blinkY);
  }

  /* ---------------- speech + toast chime (identical to the screen prototype) ---------------- */
  let voices = [];
  function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis){ loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
  function pickSwissGermanVoice(){
    if (!voices || !voices.length) return null;
    return voices.find(v => /de-CH/i.test(v.lang)) || voices.find(v => /de-DE/i.test(v.lang)) || voices.find(v => /^de/i.test(v.lang)) || null;
  }
  function speak(text){
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickSwissGermanVoice();
    if (v) u.voice = v;
    u.lang = (v && v.lang) || 'de-CH';
    u.rate = 0.92;
    window.speechSynthesis.speak(u);
  }
  let audioCtx = null;
  function clink(){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      [1318.5, 1975.5].forEach((freq,i) => {
        const now = audioCtx.currentTime + i*0.06;
        const osc = audioCtx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = freq;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.07, now+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, now+1.1);
        osc.connect(g).connect(audioCtx.destination);
        osc.start(now); osc.stop(now+1.2);
      });
    }catch(e){}
  }

  function triggerGreeting(){
    if (active) return;
    active = true;
    greetStart = performance.now();
    clink();
    speak(TOAST_TEXT);
    toastCaption.textContent = TOAST_TEXT;
    toastCaption.classList.add('show');
    setTimeout(() => toastCaption.classList.remove('show'), GREETING_MS + 400);
  }

  /* ---------------- AFRAME / MindAR wiring ---------------- */
  AFRAME.registerComponent('figure-canvas', {
    init: function(){
      canvas = document.createElement('canvas');
      canvas.width = CANVAS_W; canvas.height = CANVAS_H;
      ctx = canvas.getContext('2d');
      const self = this;
      this.ready = false;
    },
    tick: function(){
      const mesh = this.el.getObject3D('mesh');
      if (!mesh) return;
      if (!this.ready){
        texture = new THREE.CanvasTexture(canvas);
        mesh.material.map = texture;
        mesh.material.transparent = true;
        mesh.material.needsUpdate = true;
        this.ready = true;
      }
      drawFrame();
      texture.needsUpdate = true;
    }
  });

  function base64ToBlobUrl(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    return URL.createObjectURL(blob);
  }

  function buildScene(targetUrl){
    const sceneEl = document.createElement('a-scene');
    sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${targetUrl}; autoStart: false; uiScanning: no; uiLoading: no; uiError: no;`);
    sceneEl.setAttribute('color-space', 'sRGB');
    sceneEl.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights');
    sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
    sceneEl.setAttribute('device-orientation-permission-ui', 'enabled: false');

    const camera = document.createElement('a-camera');
    camera.setAttribute('position', '0 0 0');
    camera.setAttribute('look-controls', 'enabled: false');
    sceneEl.appendChild(camera);

    const anchor = document.createElement('a-entity');
    anchor.setAttribute('mindar-image-target', 'targetIndex: 0');

    const plane = document.createElement('a-plane');
    plane.setAttribute('position', '0 0 0');
    plane.setAttribute('height', '1');
    plane.setAttribute('width', String(432/288));
    plane.setAttribute('material', 'shader: flat; transparent: true; opacity: 1');
    plane.setAttribute('figure-canvas', '');
    anchor.appendChild(plane);

    sceneEl.appendChild(anchor);
    document.body.appendChild(sceneEl);

    anchor.addEventListener('targetFound', () => {
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 1400);
      triggerGreeting();
    });
    anchor.addEventListener('targetLost', () => {
      active = false;
    });

    sceneEl.addEventListener('loaded', () => {
      const sys = sceneEl.systems['mindar-image-system'];
      if (sys) sys.start();
    });
  }

  startBtn.addEventListener('click', () => {
    if (!TARGET_MIND_BASE64){
      errorBox.style.display = 'flex';
      return;
    }
    startOverlay.style.display = 'none';
    if (window.speechSynthesis) window.speechSynthesis.getVoices();
    const url = base64ToBlobUrl(TARGET_MIND_BASE64);
    buildScene(url);
  });
})();
